    <!DOCTYPE html>
    <html>
    <head>
        <title>EE Prerequisites</title>
        <style>
            body {
                background: #f4f7f6;
                display: flex;
                justify-content: center;
                padding: 40px;
                font-family: sans-serif;
            }

            svg {
                background: white;
                border-radius: 15px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            }

            /* Subject Box Hover */
            .node rect {
                transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s;
                cursor: pointer;
            }

            .node.is-hovered rect {
                transform: scale(1.15);
                filter: brightness(1.1);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            }

            /* Arrow Hover */
            .connector {
                transition: stroke-width 0.3s, opacity 0.3s, stroke 0.3s;
                pointer-events: none;
            }

            .connector.highlight {
                stroke-width: 3;
                opacity: 1;
            }

            .year-label {
                fill: #cbd5e0;
                font-weight: 800;
                font-size: 16px;
                pointer-events: none;
            }
        </style>
        <script>
            function syncHover(sid, isEntering) {
                const node = document.getElementById('node-' + sid);
                const arrows = document.querySelectorAll('.from-' + sid);
                if (isEntering) {
                    node.classList.add('is-hovered');
                    arrows.forEach(a => a.classList.add('highlight'));
                } else {
                    node.classList.remove('is-hovered');
                    arrows.forEach(a => a.classList.remove('highlight'));
                }
            }
        </script>
    </head>
